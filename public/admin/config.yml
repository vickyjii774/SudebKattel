# Decap Turbo configuration.
# Replace 769595f9-7703-4bf9-a43e-c35de4a19b58 with the Site ID from your Decap Turbo
# dashboard (Site overview). Also allow your deployed /admin URL in Admin
# interface URLs in Turbo before trying to sign in.
backend:
  name: turbo-github
  turbo_site_id: 769595f9-7703-4bf9-a43e-c35de4a19b58
  branch: main
  deploy_status: true

media_folder: public/images/uploads
public_folder: /images/uploads

publish_mode: simple
collections:
  - name: portfolio
    label: Portfolio Content
    files:
      - name: site_data
        label: Website Content
        file: src/data/siteData.json
        format: json
        fields:
          - label: Profile
            name: profile
            widget: object
            fields:
              - { label: Full Name, name: name, widget: string }
              - { label: Short Name, name: shortName, widget: string, required: false }
              - { label: Role / Headline, name: role, widget: string }
              - { label: Nepali Introduction, name: introduction, widget: text }
              - { label: About Description, name: about, widget: text }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Email, name: email, widget: string }
              - { label: Profile Image, name: image, widget: image, required: false }
              - label: Social Links
                name: socials
                widget: list
                required: false
                fields:
                  - { label: Platform, name: label, widget: string }
                  - { label: URL, name: url, widget: string, required: false }
          - label: Education
            name: education
            widget: list
            required: false
            fields:
              - { label: Qualification, name: qualification, widget: string }
              - { label: Institution, name: institution, widget: string }
              - { label: Period, name: period, widget: string }
              - { label: Details, name: description, widget: text, required: false }
          - label: Experience
            name: experience
            widget: list
            required: false
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Organization, name: company, widget: string }
              - { label: Period, name: period, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Achievements
            name: achievements
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Category, name: category, widget: string, required: false }
              - { label: Description, name: description, widget: text }
          - label: Events
            name: events
            widget: list
            required: false
            fields:
              - { label: Event Name, name: title, widget: string }
              - { label: Category, name: category, widget: string, required: false }
              - { label: Date, name: date, widget: string, required: false }
              - { label: Description, name: description, widget: text }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Link, name: url, widget: string, required: false }
          - label: Gallery
            name: gallery
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Link, name: url, widget: string, required: false }
